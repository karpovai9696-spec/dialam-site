name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python syntax
        run: python -m py_compile admin/server.py admin/smoke_test.py
      - name: Admin smoke + security test
        run: python admin/smoke_test.py
      - name: JS syntax
        run: node --check admin/static/js/admin.js
